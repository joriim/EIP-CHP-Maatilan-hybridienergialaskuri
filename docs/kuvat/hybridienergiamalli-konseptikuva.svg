<text x="52" y="132.96" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#5D6170">Sähkö, lämpö, varastointi ja talous samassa tuntivertailussa</text>
<text x="50" y="206.86" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#6D637C">LÄHTÖTIEDOT JA VALINNAT</text>
