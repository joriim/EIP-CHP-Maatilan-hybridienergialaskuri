<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
<title id="title">Maatilan hybridienergiamallin konseptikuva</title>
<desc id="desc">Tilan kulutus, sää, hinnat, ohjaus ja investointioletukset yhdistyvät sähkön ja lämmön tuntimalliin. Aurinkosähkö, verkko ja akku kytkeytyvät sähkönkulutukseen. Lämpöpumppu ja sähkökattila yhdistävät sähkön lämmitykseen. Nykyinen hake- tai biokaasulämpö, lämpövaraaja ja lämmöntarve muodostavat lämpöjärjestelmän. Akun reservikäyttö lisää energia- ja tulovaikutukset. Tuloksina ovat energiatase, kannattavuus ja erilliset päästöarviot.</desc>
