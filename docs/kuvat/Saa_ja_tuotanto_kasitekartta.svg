<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170" role="img" aria-labelledby="title desc">
<title id="title">Sää ja tuotanto</title>
<desc id="desc">Miten referenssiprofiilit ja laitevalinnat yhdistyvät?. Ulkolämpötila. Aurinkosähkön profiili. Laitteiden ominaisuudet</desc>
<rect width="1800" height="1170" fill="#FAF9FC"/>
<text x="55" y="59.68" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#6D637C">MAATILAN HYBRIDIENERGIAMALLI</text>
<rect x="500" y="105" width="800" height="140" rx="20" fill="#542583"/>
<text x="540" y="162.44" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Sää ja tuotanto</text>
<text x="540" y="211.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">Miten referenssiprofiilit ja laitevalinnat yhdistyvät?</text>
<polyline points="900,245 900,290" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<polyline points="315,290 1485,290" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<polyline points="315,290 315,340" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<polyline points="900,290 900,340" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<polyline points="1485,290 1485,340" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<rect x="50" y="340" width="530" height="420" rx="20" fill="#FFFFFF" stroke="#DCD6E4" stroke-width="2"/>
<text x="76" y="397.42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#542583">Ulkolämpötila</text>
<text x="76" y="458.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Lämpötilan tuntisarja: °C</text>
<text x="76" y="497.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Ohjaa lämpöpumpun COP:ta</text>
<text x="76" y="536.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Pakkasraja rajoittaa toimintaa</text>
<text x="76" y="575.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Kalibroi laitteen käyttötiedoilla</text>
<text x="76" y="693.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">Oma lämmöntarvesarja on syöte.</text>
<text x="76" y="727.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">Sitä ei sääkorjata automaattisesti.</text>
<polyline points="315,760 315,808" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<rect x="635" y="340" width="530" height="420" rx="20" fill="#FFFFFF" stroke="#DCD6E4" stroke-width="2"/>
<text x="661" y="397.42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#542583">Aurinkosähkön profiili</text>
<text x="661" y="458.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Tuntituotto: kWh / kWp</text>
<text x="661" y="497.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Asennettu PV-teho: kWp</text>
<text x="661" y="536.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Profiili × teho = tuotanto, kWh</text>
<text x="661" y="575.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Tuotannon ja kulutuksen ajoitus</text>
<text x="661" y="693.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">Sijainti, suuntaus ja varjostus</text>
<text x="661" y="727.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">tulee huomioida lähtöprofiilissa.</text>
<polyline points="900,760 900,808" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<rect x="1220" y="340" width="530" height="420" rx="20" fill="#FFFFFF" stroke="#DCD6E4" stroke-width="2"/>
<text x="1246" y="397.42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#542583">Laitteiden ominaisuudet</text>
<text x="1246" y="458.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">PV:n nimellisteho ja tuottoprofiili</text>
<text x="1246" y="497.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Lämpöpumpun teho ja COP-rajat</text>
<text x="1246" y="536.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Akun teho, kapasiteetti ja häviö</text>
<text x="1246" y="575.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Varaajan tilavuus, teho ja häviö</text>
<text x="1246" y="693.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">Teho- ja varastorajat määräävät</text>
<text x="1246" y="727.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">hyödynnettävän energian.</text>
<polyline points="1485,760 1485,808" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<polyline points="315,808 1485,808" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<polyline points="900,808 900,845" fill="none" stroke="#B5A5C8" stroke-width="4"/>
<rect x="285" y="845" width="1230" height="188" rx="20" fill="#EDE7F4"/>
<text x="320" y="898.42" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#542583">Sama tunti yhdistää tuotannon ja tarpeen</text>
<text x="320" y="945.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Lämpötila + PV-profiili + laitevalinnat + kulutussarjat</text>
<text x="320" y="981.5" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#273145">Tuloksena tuotanto, varastointi, verkon käyttö ja lämmön riittävyys.</text>
<text x="55" y="1088.86" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#5D6170">Sää- ja PV-referenssin alkuperäketju on puutteellinen. Eri aineistovuodet muodostavat skenaarion.</text>
<text x="55" y="1138.04" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#5D6170">Lähde: mallin 0.9.1 käyttö- ja menetelmäkuvaus · 22.10.2026 · EIP CHP / SeAMK · CC BY 4.0</text>
</svg>