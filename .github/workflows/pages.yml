# Julkaisee selainversion (web/index.html) ja siihen liitetyn Rakennushaun (web/rakennushaku.html) GitHub Pagesiin jokaisesta main-haaran muutoksesta.
# Ota käyttöön: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Selainversio GitHub Pagesiin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kokoa web/index.html ja web/rakennushaku.html
        run: python scripts/rakenna_web.py
      - name: Valmistele julkaisukansio
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp web/rakennushaku.html _site/rakennushaku.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
